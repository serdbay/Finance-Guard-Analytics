name: dbt CI Pipeline

on:
  pull_request:
    branches: [ main ]

jobs:
  dbt-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          pip install dbt-core dbt-fabricspark

      - name: Create profiles.yml
        run: |
          mkdir -p /home/runner/.dbt
          python3 -c "
          import yaml
          profile = {
            'financeGuard': {
              'target': 'dev',
              'outputs': {
                'dev': {
                  'type': 'fabricspark',
                  'method': 'livy',
                  'name': 'placeholder',
                  'endpoint': 'https://placeholder.fabric.microsoft.com',
                  'schema': 'placeholder',
                  'workspaceid': '00000000-0000-0000-0000-000000000000',
                  'lakehouseid': '00000000-0000-0000-0000-000000000000',
                  'lakehouse': 'placeholder'
                }
              }
            }
          }
          with open('/home/runner/.dbt/profiles.yml', 'w') as f:
            yaml.dump(profile, f)
          "

      - name: Run dbt parse
        run: |
          dbt parse
        env:
          DBT_PROFILES_DIR: /home/runner/.dbt